name: AI guidance check

# Verifies the guidance for AI coding assistants (docs/ai): the claims it makes exist in the released jars,
# the versions it describes are current, and its examples compile and their tests pass.
# Runs on changes to docs/ai, weekly (to catch new Serenity releases and changes in the sample sites),
# and on demand.

on:
  push:
    paths:
      - 'docs/ai/**'
      - '.github/workflows/ai-guidance.yml'
  pull_request:
    paths:
      - 'docs/ai/**'
      - '.github/workflows/ai-guidance.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome for Testing and its driver
        run: |
          npm install puppeteer
          npx @puppeteer/browsers install chrome@stable

      - name: Install Playwright browsers
        run: npx --yes playwright@1.52.0 install --with-deps chromium

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-ai-guidance-${{ hashFiles('docs/ai/skill/versions.json') }}
          restore-keys: ${{ runner.os }}-m2-ai-guidance

      - name: Run the release check
        # MVN_OFFLINE is empty so that Maven may download the harness dependencies.
        run: xvfb-run --auto-servernum bash docs/ai/skill/release-check.sh
        env:
          MVN_OFFLINE: ''
