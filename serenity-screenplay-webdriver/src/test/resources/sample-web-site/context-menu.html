<!DOCTYPE html>
<html>
<head>
<title>The Internet</title>
<style>
  #hot-spot { width: 300px; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center; border: 2px dashed #999; }
</style>
</head>
<body>
  <h3>Context Menu</h3>
  <div id="hot-spot" oncontextmenu="showAlert(event)">Right-click here</div>
  <script>
    function showAlert(e) {
      e.preventDefault();
      alert("You selected a context menu");
    }
  </script>
</body>
</html>
