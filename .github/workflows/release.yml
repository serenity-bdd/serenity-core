name: Release to Maven Central
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, e.g. 5.4.0 (leave empty to use the current SNAPSHOT version without the suffix)
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # JDK 25 is required for the javadoc --no-fonts option (see the deploy profile in pom.xml).
      # The code is still compiled with --release 17.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Maven 3.10.0 breaks central-publishing-maven-plugin (maven-metadata-local.xml ends up in the
      # bundle and Central rejects it: "Bundle has content that does NOT have a .pom file").
      # Pin Maven 3.9.x until a plugin release containing the fix (mavenplugins/central-publishing-maven-plugin#79/#80) is available.
      - name: Install Maven 3.9.14
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz
          curl -fsSL -o /tmp/maven.tar.gz.sha512 https://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz.sha512
          echo "$(cat /tmp/maven.tar.gz.sha512)  /tmp/maven.tar.gz" | sha512sum -c -
          sudo tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_TOKEN_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_TOKEN_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Run Maven Release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          args=()
          if [ -n "$RELEASE_VERSION" ]; then
            args+=("-DreleaseVersion=$RELEASE_VERSION")
          fi
          mvn release:prepare release:perform \
            -Darguments='-Dmaven.test.skip=true' \
            -Pdeploy \
            "${args[@]}"
